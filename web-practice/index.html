<!DOCTYPE html>
<html>
    <head>
        <title>My first web page</title>
        <link rel="stylesheet" href = "style.css">
    </head>
    <body>
        <div>
        <h1 id="heading">Hello, this is Viral's first webpage</h1>
        <p>Learning web development for Roohi </p>
        <button class = "btn" id = "add-exp">Add Expense</button>
        <button class="btn" id = "del-exp">Delete expesne</button>
        <ol id ="expense-list">
            <li>Coffee - ₹113</li>
            <li>Uber - ₹80</li>
            <li>Groceries - ₹450</li>
            <li>Transport - ₹1000</li>

        </ol>
        <input type="text" id = "amount-input" placeholder = "Enter amount">
        </div>
        <script>
        document.getElementById("add-exp").addEventListener("click", function() {
            let amount = document.getElementById("amount-input").value;
            if(amount === ""){
                alert("Enter an amount");
            } else {
            document.getElementById("expense-list").innerHTML += "<li>" + amount  + "</li>";
            document.getElementById("amount-input").value = "";
        }
    });
    </script>
    </body>
</html>
