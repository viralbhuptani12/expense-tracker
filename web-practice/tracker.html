<!DOCTYPE html>
<html>
    <head>
        <title>Expense Tracker</title>
        <link rel="stylesheet" href="tracker.css">
    </head>
    <body>
        <div>
            <h1>Expense Tracker</h1>
            <h2 id="total">Total :₹0</h2>
            <input type ="text" id = "category" placeholder ="Add categories - bills, transport, food">
            <input type ="text" id = "amount" placeholder ="Enter amount">
            <button id= "add-btn">Add expense</button>
            <ul id="expense-list">

            </ul>
        </div>

        <script>
            let expenses = JSON.parse(localStorage.getItem("expenses")) || [];
            render();
            function render(){
                document.getElementById("expense-list").innerHTML="";
                for(let i=0;i<expenses.length;i++){
                    let exp = expenses[i];
                    let li = document.createElement("li");
                    li.textContent = exp.category + " | ₹" + exp.amount;
                    let delBtn = document.createElement("button");
                    delBtn.textContent = "Delete";
                    delBtn.className = "delete-btn";
                    delBtn.addEventListener("click", function()
                    {
                        total = total - exp.amount;
                        document.getElementById("total").textContent = "Total ₹" + total;
                        localStorage.setItem("total", total);
                        expenses.splice(i,1);
                        localStorage.setItem("expenses", JSON.stringify(expenses));

                        render();
                    });
                    li.appendChild(delBtn);
                    document.getElementById("expense-list").appendChild(li);
                 
                }
            }
            let total = Number(localStorage.getItem("total") || 0);
            document.getElementById("total").textContent = "Total ₹" + total;
            document.getElementById("add-btn").addEventListener("click", function() {
                let amount = document.getElementById("amount").value;
                let category  = document.getElementById("category").value;
                if(amount === "" || category === ""){
                    alert("Please enter both the values");
                }
                else{
                    expenses.push({category: category, amount: Number(amount)})
                    localStorage.setItem("expenses", JSON.stringify(expenses));
                    total = total + Number(amount);
                    document.getElementById("total").textContent = "Total ₹" + total;
                    localStorage.setItem("total", total);
                    render();
                    document.getElementById("amount").value = "";
                    document.getElementById("category").value = "";
                }
            });
        </script>
    </body>
</html>
